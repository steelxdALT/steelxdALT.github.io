<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmony Middle School — Bell Clock</title>
<meta name="description" content="Live bell schedule clock for Harmony Middle School.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wordmark">
    <svg viewBox="0 0 24 24" class="bell-icon" aria-hidden="true">
      <path d="M12 3.5c-3.2 0-5 2.2-5 5.4v2.3c0 1-.4 2-1.1 2.8L4.8 15.3c-.6.7-.1 1.7.8 1.7h12.8c.9 0 1.4-1 .8-1.7l-1.1-1.3c-.7-.8-1.1-1.8-1.1-2.8V8.9c0-3.2-1.8-5.4-5-5.4Z"/>
      <path d="M9.8 19.2a2.3 2.3 0 0 0 4.4 0"/>
    </svg>
    <span>Harmony Middle School</span>
  </div>
  <div class="header-meta">
    <span class="day-pill" id="header-day-pill">A Day</span>
    <span class="header-date" id="header-date"></span>
    <span class="header-clock" id="header-clock"></span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Clock sections">
  <button class="tab-btn" role="tab" data-tab="clock" id="tab-clock" aria-selected="true" aria-controls="panel-clock">Clock</button>
  <button class="tab-btn" role="tab" data-tab="schedule" id="tab-schedule" aria-selected="false" aria-controls="panel-schedule">Bell Schedule</button>
  <button class="tab-btn" role="tab" data-tab="countdowns" id="tab-countdowns" aria-selected="false" aria-controls="panel-countdowns">Countdowns</button>
</nav>

<main>

  <section id="panel-clock" class="panel" role="tabpanel" aria-labelledby="tab-clock">
    <div class="hero">
      <div class="hero-time" id="hero-time">
        <span id="hero-h">--</span><span class="colon">:</span><span id="hero-m">--</span><span class="colon">:</span><span id="hero-s">--</span>
        <span class="hero-ampm" id="hero-ampm">--</span>
      </div>
      <div class="hero-date" id="hero-date">&nbsp;</div>
      <div class="hero-year" id="hero-year">&nbsp;</div>
    </div>

    <div class="status-card" id="status-card">
      <div class="status-kind">Loading&hellip;</div>
    </div>
  </section>

  <section id="panel-schedule" class="panel" role="tabpanel" aria-labelledby="tab-schedule" hidden>
    <div class="schedule-toolbar">
      <div class="day-toggle" role="group" aria-label="Choose which schedule to view">
        <button class="toggle-btn" id="toggle-a" data-day="A" aria-pressed="false">A Day</button>
        <button class="toggle-btn" id="toggle-b" data-day="B" aria-pressed="false">B Day</button>
      </div>
      <p class="schedule-note" id="schedule-note"></p>
    </div>
    <div class="schedule-list" id="schedule-list"></div>
  </section>

  <section id="panel-countdowns" class="panel" role="tabpanel" aria-labelledby="tab-countdowns" hidden>
    <div class="countdown-grid">

      <article class="countdown-card">
        <svg viewBox="0 0 24 24" class="cd-icon" aria-hidden="true"><path d="M12 3.5c-3.2 0-5 2.2-5 5.4v2.3c0 1-.4 2-1.1 2.8L4.8 15.3c-.6.7-.1 1.7.8 1.7h12.8c.9 0 1.4-1 .8-1.7l-1.1-1.3c-.7-.8-1.1-1.8-1.1-2.8V8.9c0-3.2-1.8-5.4-5-5.4Z"/><path d="M9.8 19.2a2.3 2.3 0 0 0 4.4 0"/></svg>
        <h3 class="cd-title">Next Bell</h3>
        <div class="cd-timer" id="cd-bell-timer">00:00:00</div>
        <p class="cd-subtitle" id="cd-bell-subtitle">&nbsp;</p>
      </article>

      <article class="countdown-card">
        <svg viewBox="0 0 24 24" class="cd-icon" aria-hidden="true"><path d="M8 3.5h6a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H8"/><path d="M8 3.5H6A1.5 1.5 0 0 0 4.5 5v14A1.5 1.5 0 0 0 6 20.5h2"/><path d="M14 12h4m-2-2 2 2-2 2"/></svg>
        <h3 class="cd-title">School Ends</h3>
        <div class="cd-timer" id="cd-end-timer">00:00:00</div>
        <p class="cd-subtitle" id="cd-end-subtitle">&nbsp;</p>
      </article>

      <article class="countdown-card">
        <svg viewBox="0 0 24 24" class="cd-icon" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3"/><path d="m9 14 2 2 4-4"/></svg>
        <h3 class="cd-title">Next School Day</h3>
        <div class="cd-timer" id="cd-next-timer">00:00:00</div>
        <p class="cd-subtitle" id="cd-next-subtitle">&nbsp;</p>
      </article>

      <article class="countdown-card">
        <svg viewBox="0 0 24 24" class="cd-icon" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2.1M12 18.7v2.1M4.6 12H6.7M17.3 12h2.1M6.3 6.3l1.5 1.5M16.2 16.2l1.5 1.5M6.3 17.7l1.5-1.5M16.2 7.8l1.5-1.5"/></svg>
        <h3 class="cd-title" id="cd-weekend-title">The Weekend</h3>
        <div class="cd-timer" id="cd-weekend-timer">00:00:00</div>
        <p class="cd-subtitle" id="cd-weekend-subtitle">&nbsp;</p>
      </article>

    </div>
  </section>

</main>

<div class="tooltip" id="tooltip" role="status"></div>

<script src="script.js" defer></script>
</body>
</html>
